[project]
name = "code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aljoscha Labonte", email = "aljoscha.labonte@uni-jena.de" }
]
requires-python = ">=3.13"
dependencies = [
    "cyclopts>=5.3.3",
    "dataframe-image>=0.2.7",
    "matplotlib>=3.11.2",
    "netifaces>=0.11.0",
    "notebook>=7.6.4",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pingouin>=0.7.0",
    "scapy>=2.8.0",
    "scikit-posthocs>=0.17.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[project.scripts]
code = "code:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
